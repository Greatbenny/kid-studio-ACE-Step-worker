name: Build Seed-VC singing worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "singing-worker/**"
      - ".github/workflows/build-seed-vc-singing.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: seed-vc-singing-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free build disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
          df -h

      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kid-studio-seed-vc-singing-worker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./singing-worker
          file: ./singing-worker/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        run: echo "${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
